[package]
name = "baidu-tieba-auto-sign"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["cookies", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
env_logger = "0.11"
log = "0.4"
